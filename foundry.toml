[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = "contracts/.forge-snapshots/"}]
libs = ["contracts/lib"]
out = "contracts/out"
script = "contracts/script"
solc_version = "0.8.30"
src = "contracts/src"
test = "contracts/test"
via_ir = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false