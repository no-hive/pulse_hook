name: release

on:
  push:
    branches: [main]

# release-please needs to open/update PRs and, once merged, push a tag
# and create a GitHub Release.
permissions:
  contents: write
  pull-requests: write

# Don't cancel a release run mid-flight if another push comes in — let it
# finish so the manifest/tag state stays consistent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # release-please reads Conventional Commits merged into main since
      # the last release and does ONE of two things on every push:
      #
      #  1. No open release PR yet, or new qualifying commits landed:
      #     it opens/updates a "chore(main): release X.Y.Z" PR containing
      #     the version bump + generated CHANGELOG.md. Nothing is tagged
      #     or released yet at this point.
      #
      #  2. That release PR was just merged (this push IS the merge
      #     commit): it creates the git tag vX.Y.Z and a GitHub Release.
      #
      # Because step 2 only fires on a human merging the release PR, a
      # tag is never created automatically off a plain push — useful for
      # a contracts repo where a tag can be read as "this version was
      # reviewed/deployed", not just "the version counter went up".
      #
      # Bump rules (see release-please-config.json):
      #   fix, perf, refactor           -> patch  (0.0.x)
      #   feat                          -> minor  (0.x.0)
      #   feat! / "BREAKING CHANGE:"    -> minor while major is 0
      #                                    (bump-minor-pre-major: true),
      #                                    would be major once you cut 1.0.0
      #   docs, style, test, build, ci,
      #   chore                         -> no release triggered
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Fires only on the merge-the-release-PR run (step 2 above), once
      # release-please has actually cut the tag/release. Useful hook
      # point if you later want to notify Slack, kick off a deploy
      # workflow, etc. — gate any of that on this same output.
      - name: Log release outcome
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "Released ${{ steps.release.outputs.tag_name }}"